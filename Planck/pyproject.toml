[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planck-blackbody-radiation"
version = "1.0.0"
description = "Interactive readable edition of Max Planck's Quantum Theory of Blackbody Radiation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jeong Hoon Kim", email = "jk9576@hanyang.ac.kr" }
]
dependencies = []

[project.scripts]
planck = "planck.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["planck*"]
