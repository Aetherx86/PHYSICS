[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feynman-path-integral"
version = "1.0.0"
description = "Interactive readable edition of Richard Feynman's Path Integral Formulation of Quantum Mechanics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jeong Hoon Kim", email = "jk9576@hanyang.ac.kr" }
]
dependencies = []

[project.scripts]
feynman = "feynman.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["feynman*"]
